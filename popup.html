<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Nocturn — dark editorial. 100% local, no remote fonts. */
  :root {
    color-scheme: dark;
    --bg-app: #13111a; --surface-2: #1e1b27; --surface-3: #221b27; --surface-4: #26222f;
    --brand: #42344b; --brand-medium: #5a4869; --brand-strong: #54435f;
    --fg-heading: #fff; --fg-body: #d4d0dc; --fg-subtle: #a8a3b0; --fg-brand: #b9a6c6;
    --border-subtle: #26222f; --border-default: #33313b;
    --success-fg: #8ab89a; --success-bg: #182a20; --success-border: #21392b;
    --warning-fg: #e5b57a; --warning-bg: #2e2110; --warning-border: #46341a;
    --font-ui: "Inter", system-ui, -apple-system, sans-serif;
    --font-display: "IBM Plex Serif", Georgia, serif;
    --glint: 0 1px 2px 0 #0000000d, inset #ffffff1f 0 6px 0 -5px, #00000040 0 4px 10px -5px;
  }
  * { box-sizing: border-box; }
  body {
    width: 306px; margin: 0;
    font: 400 13px/1.5 var(--font-ui);
    background: var(--bg-app); color: var(--fg-body);
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 9px;
    padding: 14px 16px 12px;
    background: linear-gradient(180deg, #221b27 0%, #181621 100%);
    border-bottom: 1px solid var(--border-subtle);
  }
  header h1 { font: 600 15px var(--font-ui); letter-spacing: -0.01em; margin: 0; color: var(--fg-heading); }
  header .count {
    margin-left: auto; font: 600 15px var(--font-display); color: var(--fg-brand);
    background: var(--surface-4); border: 1px solid var(--border-default);
    border-radius: 9999px; padding: 2px 11px; min-width: 30px; text-align: center;
  }
  .status { padding: 9px 16px; font-size: 12px; font-weight: 500; line-height: 1.45; }
  .status.ok   { background: var(--success-bg); color: var(--success-fg); border-bottom: 1px solid var(--success-border); }
  .status.warn { background: var(--warning-bg); color: var(--warning-fg); border-bottom: 1px solid var(--warning-border); }
  .status.off  { background: var(--surface-2); color: var(--fg-subtle); border-bottom: 1px solid var(--border-subtle); }
  .section { padding: 8px 16px 12px; border-bottom: 1px solid var(--border-subtle); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; gap: 10px; }
  .row label { flex: 1; cursor: pointer; color: var(--fg-body); }
  .row label strong { color: var(--fg-heading); font-weight: 600; }
  input[type="checkbox"] { accent-color: var(--brand-medium); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
  .statsline { font-size: 11.5px; color: var(--fg-subtle); text-align: center; margin-bottom: 10px; }
  #openOptions {
    width: 100%; padding: 9px;
    background: var(--brand); background-image: linear-gradient(rgba(255,255,255,.12), rgba(0,0,0,0));
    color: #fff; border: 1px solid var(--brand); border-radius: 12px; box-shadow: var(--glint);
    font: 600 12px var(--font-ui); cursor: pointer;
  }
  #openOptions:hover { background: var(--brand-strong); }
  footer { padding: 10px 16px; font-size: 11px; color: var(--fg-subtle); text-align: center; }
</style>
</head>
<body>
  <header>
    <span>🛡️</span>
    <h1>DLP Guard</h1>
    <span class="count" id="count">0</span>
  </header>

  <div class="status off" id="status">Loading…</div>

  <div class="section">
    <div class="row">
      <label for="enabled"><strong>Protection enabled</strong></label>
      <input type="checkbox" id="enabled">
    </div>
    <div class="row">
      <label for="site" id="siteLabel">Enable on this site</label>
      <input type="checkbox" id="site">
    </div>
  </div>

  <div class="section">
    <div class="row">
      <label for="maskOnPage">Hide secrets on pages</label>
      <input type="checkbox" id="maskOnPage">
    </div>
    <div class="row">
      <label for="redactPaste">Redact secrets on paste</label>
      <input type="checkbox" id="redactPaste">
    </div>
  </div>

  <div class="section" style="border-bottom:none;">
    <div class="statsline" id="statsLine">No bypasses yet</div>
    <button id="openOptions">⚙️ Advanced settings</button>
  </div>

  <footer>100% local · never active on login pages</footer>
  <script src="src/popup.js"></script>
</body>
</html>
